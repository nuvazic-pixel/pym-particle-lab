name: Experiment 002

on:
  workflow_dispatch:
  push:
    paths:
      - "pym/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/experiment-002.yml"

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Run Experiment 002
        run: python -m pym.lab.runner
      - name: Upload equivalence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-results
          path: artifacts/
