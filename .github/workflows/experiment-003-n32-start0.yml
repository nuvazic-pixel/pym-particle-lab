name: Experiment 003 N32 Start0 Recovery

on:
  workflow_dispatch:

jobs:
  n32-start0:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run N32 seeds 43000-43009
        run: python -m pym.lab.prehistory_runner --n 32 --k-starts 10 --start-index 0
      - name: Upload N32 start0 recovery
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003-N32-start0-recovery
          path: artifacts_prehistory/N32_start0/
