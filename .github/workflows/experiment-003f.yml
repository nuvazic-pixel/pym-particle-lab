name: Experiment 003F Local Basin Projection Audit
on:
  workflow_dispatch:
jobs:
  basin-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003F
        run: python -m pym.lab.basin_projection
      - name: Upload Experiment 003F artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003f-basin-projection
          path: artifacts_basin_projection/
