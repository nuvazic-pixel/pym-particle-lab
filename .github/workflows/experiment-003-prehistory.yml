name: Experiment 003 Prehistory

on:
  workflow_dispatch:

jobs:
  prehistory:
    strategy:
      fail-fast: false
      matrix:
        N: [1, 2, 4, 8, 16, 32]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003 Prehistory N=${{ matrix.N }}
        run: python -m pym.lab.prehistory_runner --n ${{ matrix.N }}
      - name: Upload Experiment 003 N=${{ matrix.N }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003-prehistory-N${{ matrix.N }}
          path: artifacts_prehistory/N${{ matrix.N }}/
