name: Experiment 003H N2 Boundary Assault
on:
  workflow_dispatch:
jobs:
  n2-assault:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003H
        run: python -m pym.lab.n2_assault
      - name: Upload Experiment 003H artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003h-n2-boundary-assault
          path: artifacts_n2_assault/
