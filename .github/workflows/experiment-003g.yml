name: Experiment 003G Recursive Projection Descent
on:
  workflow_dispatch:
jobs:
  recursive-descent:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003G
        run: python -m pym.lab.recursive_descent
      - name: Upload Experiment 003G artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003g-recursive-descent
          path: artifacts_recursive_descent/
