name: Experiment 002 Bounds

on:
  workflow_dispatch:

jobs:
  bounds-control:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 002 Bounds
        run: python -m pym.lab.bounds_runner
      - name: Upload bounds artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-bounds-results
          path: artifacts_bounds/
