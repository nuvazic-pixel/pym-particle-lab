name: Experiment 002 Spectral Sensitivity

on:
  workflow_dispatch:

jobs:
  spectral-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Download Exp 002 Bounds artifact
        uses: actions/download-artifact@v4
        with:
          name: experiment-002-bounds-results
          path: artifacts_input
          github-token: ${{ github.token }}
          run-id: 35774453533
      - name: Run spectral sensitivity audit
        run: python -m pym.lab.spectral_runner
      - name: Upload spectral artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-spectral-results
          path: artifacts_spectral/
