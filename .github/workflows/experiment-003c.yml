name: Experiment 003C Compression Pruning
on:
  workflow_dispatch:
jobs:
  pruning:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003C
        run: python -m pym.lab.pruning
      - name: Upload Experiment 003C artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003c-compression-pruning
          path: artifacts_pruning/
