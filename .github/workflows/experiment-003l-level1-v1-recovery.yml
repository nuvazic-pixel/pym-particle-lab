name: Experiment 003L Level-1 v1 Recovery T5 N32

on:
  workflow_dispatch:
  push:
    branches:
      - feature/003l-model-class-ladder
    paths:
      - .github/workflows/experiment-003l-level1-v1-recovery.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06a450a9a69bc940ea941e9d7339417d97282727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Verify frozen v1 source
        run: test "$(git rev-parse HEAD)" = "06a450a9a69bc940ea941e9d7339417d97282727"
      - name: Recover T5 N32
        run: python -m pym.lab.experiment_003l_level1 --T 5.0 --N 32
      - name: Upload recovered v1 cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 003l-l1-v1-recovery-T5000ms-N32
          path: artifacts_003l_level1/cell_T5000ms_N32.json
          if-no-files-found: error
          retention-days: 90
