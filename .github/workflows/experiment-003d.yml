name: Experiment 003D Minimal Realization Search
on:
  workflow_dispatch:
jobs:
  minimal-search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run Experiment 003D
        run: python -m pym.lab.minimal_search
      - name: Upload Experiment 003D artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003d-minimal-realization
          path: artifacts_minimal/
