name: Experiment 003L Level-1 v2 Recovery T5 N32

on:
  workflow_dispatch:
  push:
    branches:
      - feature/003l-model-class-ladder
    paths:
      - .github/workflows/experiment-003l-level1-v2-recovery.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54aff04704fa5e8ca141be443386df909ce7d75b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Verify frozen v2 execution source
        run: test "$(git rev-parse HEAD)" = "54aff04704fa5e8ca141be443386df909ce7d75b"
      - name: Protocol gate
        run: pytest -q tests/test_damped_multimode_bath.py tests/test_experiment_003l_level1.py
      - name: Recover T5 N32
        run: python -m pym.lab.experiment_003l_level1 --T 5.0 --N 32
      - name: Upload recovered v2 cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 003l-l1-v2-recovery-T5000ms-N32
          path: artifacts_003l_level1_v2/cell_T5000ms_N32.json
          if-no-files-found: error
          retention-days: 90
