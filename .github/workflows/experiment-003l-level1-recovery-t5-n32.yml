name: Experiment 003L Level-1 Recovery T5 N32

on:
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout frozen Level-1 execution SHA
        uses: actions/checkout@v4
        with:
          ref: 06a450a9a69bc940ea941e9d7339417d97282727

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen code
        run: python -m pip install -e ".[test]"

      - name: Verify frozen protocol gate
        run: pytest -q tests/test_damped_multimode_bath.py tests/test_experiment_003l_level1.py

      - name: Run only censored cell T=5.0 N=32
        run: python -m pym.lab.experiment_003l_level1 --T 5.0 --N 32

      - name: Verify exact canonical payload
        run: test -s artifacts_003l_level1/cell_T5000ms_N32.json

      - name: Upload recovered cell
        uses: actions/upload-artifact@v4
        with:
          name: 003l-l1-recovery-T5000ms-N32
          path: artifacts_003l_level1/cell_T5000ms_N32.json
          if-no-files-found: error
          retention-days: 90
