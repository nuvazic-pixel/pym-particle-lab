name: Experiment 003 N32 Chunks

on:
  workflow_dispatch:

jobs:
  n32:
    strategy:
      fail-fast: false
      matrix:
        start_index: [0, 10, 20, 30, 40]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Run N32 seed chunk
        run: python -m pym.lab.prehistory_runner --n 32 --k-starts 10 --start-index ${{ matrix.start_index }}
      - name: Upload N32 chunk
        uses: actions/upload-artifact@v4
        with:
          name: experiment-003-N32-start${{ matrix.start_index }}
          path: artifacts_prehistory/N32_start${{ matrix.start_index }}/
